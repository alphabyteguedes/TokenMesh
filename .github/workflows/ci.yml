name: TokenMesh CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: MyPy type check
        run: mypy core/ --ignore-missing-imports

  unit-and-integration-tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          TOKENMESH_OPENAI_API_KEY: "sk-test-ci-key"
          TOKENMESH_ANTHROPIC_API_KEY: "sk-ant-test-ci-key"
          TOKENMESH_DUCKDB_PATH: ":memory:"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t tokenmesh:test .
      - name: Verify container starts
        run: |
          docker run -d --name tokenmesh-test -p 8787:8787 \
            -e TOKENMESH_OPENAI_API_KEY=sk-test \
            -e TOKENMESH_ANTHROPIC_API_KEY=sk-ant-test \
            tokenmesh:test
          sleep 10
          curl -sf http://localhost:8787/healthz || exit 1
          docker stop tokenmesh-test
